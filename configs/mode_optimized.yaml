model:
  encoder_name: remoteclip
  freeze_encoder: false
  encoder_unfreeze_last_n: 2
  decoder_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  prefix_len: 10
train:
  epochs: 3
  lr: 0.0005
  precision: fp16
  grad_accum_steps: 8
  grad_checkpointing: true
  log_every_steps: 10
  save_every_steps: 100